server:
  port: 8080

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:4200}

spring:
  application:
    name: api-gateway
  http:
    client:
      connect-timeout: 2s
      read-timeout: 3s
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: product-service-cb
                    fallbackUri: forward:/fallback/product-service

            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: inventory-service-cb
                    fallbackUri: forward:/fallback/inventory-service

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: order-service-cb
                    fallbackUri: forward:/fallback/order-service

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: payment-service-cb
                    fallbackUri: forward:/fallback/payment-service

resilience4j:
  circuitbreaker:
    # a config named "default" is applied to every circuit breaker instance that doesn't
    # declare its own base-config - product-service-cb/inventory-service-cb/order-service-cb/
    # payment-service-cb (named by the gateway routes above) all pick this up automatically,
    # so there's no need to repeat it once per instance.
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true